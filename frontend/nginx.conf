server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api로 시작하는 요청은 backend 컨테이너로 프록시.
    # 프론트/백엔드가 같은 origin(이 nginx)으로 서빙되므로 브라우저 입장에서
    # cross-origin 요청이 생기지 않는다 (CorsConfig.java의 allowedOrigins는
    # 이 구조에서는 실질적으로 안 쓰임).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # react-router가 BrowserRouter를 쓰므로, 정적 파일이 아닌 모든 경로는
    # index.html로 넘겨서 클라이언트 라우팅이 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
